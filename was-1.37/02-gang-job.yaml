# Headline demo: explicit gang scheduling via .spec.scheduling.
#
# All 4 pods are admitted together or none are. gang.minCount is omitted, so it
# defaults to .spec.parallelism (4). The controller compiles this into a
# v1beta1 Workload (podGroupTemplate) and a PodGroup (gang, minCount=4), then
# stamps each Pod with .spec.schedulingGroup.podGroupName.
apiVersion: batch/v1
kind: Job
metadata:
  name: gang-job
  namespace: was-demo
spec:
  parallelism: 4
  completions: 4
  completionMode: Indexed
  scheduling:
    schedulingPolicy:
      gang: {}                # minCount omitted -> defaults to parallelism (4)
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh", "-c", "echo index $JOB_COMPLETION_INDEX up; sleep 30"]
        resources:
          requests:
            cpu: "100m"
            memory: "32Mi"
