# Full .spec.scheduling: all four building blocks in one Job.
#   - schedulingPolicy:      gang (all-or-nothing)
#   - schedulingConstraints: co-locate the group within a single zone
#   - disruptionMode:        disrupt the whole group together (all)
#
# Requires the worker nodes to carry a topology.kubernetes.io/zone label.
# verify.sh (setup) labels them; or run:
#   kubectl label node <w1> <w2> topology.kubernetes.io/zone=zone-a --overwrite
#   kubectl label node <w3>       topology.kubernetes.io/zone=zone-b --overwrite
apiVersion: batch/v1
kind: Job
metadata:
  name: gang-topology
  namespace: was-demo
spec:
  parallelism: 4
  completions: 4
  completionMode: Indexed
  scheduling:
    schedulingPolicy:
      gang: {}                # minCount -> parallelism (4)
    schedulingConstraints:
      topology:
      - key: topology.kubernetes.io/zone
    disruptionMode:
      all: {}                 # the entire group is disrupted together
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh", "-c", "echo index $JOB_COMPLETION_INDEX in zone; sleep 40"]
        resources:
          requests:
            cpu: "100m"
            memory: "32Mi"
