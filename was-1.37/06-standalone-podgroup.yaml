# A standalone PodGroup: no Workload, policy set directly on the PodGroup.
#
# Useful when you don't need a policy template — you author the runtime group
# yourself and point pods at it. This shape is verbatim from the PodGroup API.
---
apiVersion: scheduling.k8s.io/v1beta1
kind: PodGroup
metadata:
  name: standalone-pg
  namespace: was-demo
spec:
  schedulingPolicy:
    gang:
      minCount: 3
---
apiVersion: v1
kind: Pod
metadata:
  name: sa-worker-0
  namespace: was-demo
spec:
  schedulingGroup:
    podGroupName: standalone-pg
  restartPolicy: Never
  containers:
  - name: worker
    image: busybox:1.36
    command: ["sh", "-c", "echo sa-worker-0 up; sleep 30"]
    resources:
      requests: { cpu: "100m", memory: "32Mi" }
---
apiVersion: v1
kind: Pod
metadata:
  name: sa-worker-1
  namespace: was-demo
spec:
  schedulingGroup:
    podGroupName: standalone-pg
  restartPolicy: Never
  containers:
  - name: worker
    image: busybox:1.36
    command: ["sh", "-c", "echo sa-worker-1 up; sleep 30"]
    resources:
      requests: { cpu: "100m", memory: "32Mi" }
---
apiVersion: v1
kind: Pod
metadata:
  name: sa-worker-2
  namespace: was-demo
spec:
  schedulingGroup:
    podGroupName: standalone-pg
  restartPolicy: Never
  containers:
  - name: worker
    image: busybox:1.36
    command: ["sh", "-c", "echo sa-worker-2 up; sleep 30"]
    resources:
      requests: { cpu: "100m", memory: "32Mi" }
