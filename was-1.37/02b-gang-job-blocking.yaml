# Failure mode: the gang cannot reach quorum, so NOTHING binds.
#
# 6 pods are requested with a large CPU request that a 3-worker kind cluster
# cannot satisfy all at once. Because minCount defaults to parallelism (6) and
# fewer than 6 can be placed, the gang plugin parks the whole group at
# PreEnqueue/Permit — you should see 6 Pending pods and zero Running.
#
# Contrast with Basic: under Basic these same pods would bind opportunistically
# and hold resources while making zero useful progress.
apiVersion: batch/v1
kind: Job
metadata:
  name: gang-blocking
  namespace: was-demo
spec:
  parallelism: 6
  completions: 6
  completionMode: Indexed
  scheduling:
    schedulingPolicy:
      gang:
        minCount: 6           # explicit; the whole group must fit at once
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh", "-c", "echo index $JOB_COMPLETION_INDEX up; sleep 30"]
        resources:
          requests:
            cpu: "1500m"      # tuned so 6 cannot co-schedule on a small kind cluster
            memory: "64Mi"
