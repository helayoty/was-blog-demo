# Baseline: a Job that OMITS .spec.scheduling.
#
# It defaults to the Basic policy — ordinary pod-by-pod scheduling — but the
# controller STILL compiles a v1beta1 Workload + PodGroup for it, so the
# observable objects are consistent regardless of policy.
apiVersion: batch/v1
kind: Job
metadata:
  name: basic-job
  namespace: was-demo
spec:
  parallelism: 4
  completions: 4
  completionMode: Indexed
  # .spec.scheduling omitted -> defaults to Basic scheduling.
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh", "-c", "echo index $JOB_COMPLETION_INDEX up; sleep 20"]
        resources:
          requests:
            cpu: "100m"
            memory: "32Mi"
