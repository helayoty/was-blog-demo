# Contrast: a Job that does NOT qualify for WorkloadWithJob.
# completions != parallelism, so the Job controller will NOT create a
# Workload or PodGroup. Pods are scheduled independently (pod-by-pod).
#
# Compare the pod start times from this Job vs 03-gang-job.yaml to see
# the difference gang scheduling makes.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: non-gang-training
  namespace: ws-demo
spec:
  parallelism: 4
  completions: 8
  completionMode: Indexed
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: non-gang-training
    spec:
      restartPolicy: Never
      containers:
      - name: work
        image: busybox:1.36
        command:
        - /bin/sh
        - -c
        - |
          echo "[$(date -u +%H:%M:%S.%3N)] worker ${JOB_COMPLETION_INDEX} started on $(hostname)"
          sleep 10
          echo "[$(date -u +%H:%M:%S.%3N)] worker ${JOB_COMPLETION_INDEX} done"
        resources:
          requests:
            cpu: 100m
            memory: 32Mi
